<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper unfold: green-screen reveal generator</title>
<style>
:root{--ink:#1d2433;--mat:#dce8df;--sheet:#fbf8f1;--crease:#b9c4bc;--accent:#2f5bea}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--mat);
  background-image:linear-gradient(rgba(29,36,51,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(29,36,51,.07) 1px,transparent 1px);background-size:24px 24px}
main{display:grid;grid-template-columns:1fr 340px;min-height:100vh}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;min-width:0}
canvas{max-width:100%;max-height:calc(100vh - 120px);width:auto;height:auto;border:1px solid var(--ink);background:#0f0}
.bar{display:flex;gap:12px;align-items:center;width:min(100%,560px)}
.bar input{flex:1}
aside{background:var(--sheet);border-left:1px solid var(--crease);padding:22px;overflow:auto}
h1{font:600 28px/1.1 "Iowan Old Style","Palatino Linotype",Georgia,serif;margin:0 0 6px}
p{margin:0 0 16px;color:#4a5365;max-width:34ch}
.row{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;margin:7px 0}
fieldset{border:0;border-top:1px solid var(--crease);margin:16px 0 0;padding:14px 0 0}
select,button{font:inherit;color:inherit;border:1px solid var(--ink);background:#fff;padding:6px 10px;border-radius:3px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5}
progress{width:100%;height:8px}
#msg{min-height:3em;margin:10px 0 0;font-size:14px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media(max-width:820px){main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--crease)}}
</style>
<body>
<main>
  <section class="stage">
    <canvas id="cv" width="540" height="960"></canvas>
    <div class="bar"><button id="play">Pause</button><input id="scrub" type="range" min="0" max="1" step="0.001" aria-label="Timeline"><output id="clock">0.0s</output></div>
  </section>
  <aside>
    <h1>Paper unfold</h1>
    <p>Turn an image into a sheet of paper that unfolds on a keyable background. Everything runs on your device.</p>
    <input id="file" type="file" accept="image/*" hidden>
    <button id="pick" class="primary">Choose image</button>
    <div id="ctl"></div>
    <label class="row">Background<select id="key"><option value="#00ff00">Green</option><option value="#0000ff">Blue</option><option value="#ff00ff">Magenta</option></select></label>
    <label class="row">Cut to shape<input id="cut" type="checkbox"></label>
    <fieldset>
      <label class="row">Size<select id="size"><option value="v">1080 x 1920 vertical</option><option value="l">1920 x 1080 wide</option><option value="s">1080 x 1080 square</option></select></label>
      <label class="row">Frame rate<select id="fps"><option>30</option><option>60</option></select></label>
      <button id="go" class="primary">Export MP4</button> <button id="stop" hidden>Cancel</button>
      <progress id="prog" value="0" max="1" hidden></progress>
      <p id="msg" role="status" aria-live="polite">Choose an image to start. Use a transparent PNG with "Cut to shape" for a sheet that follows your subject.</p>
    </fieldset>
  </aside>
</main>
<script type="module">
import { Renderer, loadImage, exportVideo } from './src/engine.js';
import { paperUnfold as fx } from './src/effects/paper-unfold.js';
const $ = id => document.getElementById(id), P = { ...fx.defaults };
const SIZES = { v: [1080, 1920], l: [1920, 1080], s: [1080, 1080] };
let R, playing = !matchMedia('(prefers-reduced-motion: reduce)').matches, T = 0, t0 = performance.now(), dirty = true, ac;
const say = s => ($('msg').textContent = s);
try { R = new Renderer($('cv')); R.setEffect(fx); } catch (e) { say(e.message); throw e; }

const fit = () => { const [w, h] = SIZES[$('size').value]; R.resize(w / 2, h / 2); dirty = true; };
for (const [k, label, a, b, c] of fx.ui) {
  const row = document.createElement('label'); row.className = 'row';
  let el;
  if (Array.isArray(a)) { el = document.createElement('select'); a.forEach(o => el.add(new Option(o, o))); el.value = P[k]; }
  else el = Object.assign(document.createElement('input'), { type: 'range', min: a, max: b, step: c, value: P[k] });
  el.oninput = () => { P[k] = +el.value; dirty = true; };
  row.append(label, el); $('ctl').append(row);
}
$('key').onchange = e => { P.key = e.target.value; dirty = true; };
$('cut').onchange = e => { P.cutout = e.target.checked; dirty = true; };
$('size').onchange = fit;

async function load(f) {
  if (!f?.type.startsWith('image/')) return say('That file is not an image. Use PNG, JPG or WebP.');
  try { R.setImage(await loadImage(f)); T = 0; t0 = performance.now(); dirty = true; say(`${f.name} loaded. Adjust the settings, then export.`); }
  catch { say('This image could not be read. Try PNG, JPG or WebP.'); }
}
$('pick').onclick = () => $('file').click();
$('file').onchange = e => load(e.target.files[0]);
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); load(e.dataTransfer.files[0]); });

$('play').textContent = playing ? 'Pause' : 'Play';
$('play').onclick = () => { playing = !playing; t0 = performance.now() - T * 1000; $('play').textContent = playing ? 'Pause' : 'Play'; };
$('scrub').oninput = e => { playing = false; $('play').textContent = 'Play'; T = e.target.value * fx.duration(P); dirty = true; };

(function frame(now) {
  const d = fx.duration(P);
  if (playing) { T = ((now - t0) / 1000) % d; $('scrub').value = T / d; dirty = true; }
  if (dirty) { R.render(T, P); $('clock').textContent = T.toFixed(1) + 's'; dirty = false; }
  requestAnimationFrame(frame);
})(performance.now());

const busy = b => { $('go').disabled = b; $('stop').hidden = !b; $('prog').hidden = !b; $('pick').disabled = b; };
$('stop').onclick = () => ac?.abort();
$('go').onclick = async () => {
  if (!R.img) return say('Choose an image first.');
  const [w, h] = SIZES[$('size').value]; ac = new AbortController(); busy(true); say('Exporting. Keep this tab open.');
  try {
    const blob = await exportVideo(R, P, { fps: +$('fps').value, w, h, signal: ac.signal, onProgress: x => ($('prog').value = x) });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'paper-unfold.' + (blob.type.includes('webm') ? 'webm' : 'mp4') });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 6e4);
    say('Saved. Place it above your footage and key out the background color in your editor.');
  } catch (e) { say(e.name === 'AbortError' ? 'Export cancelled.' : 'Export failed: ' + e.message); }
  finally { busy(false); fit(); }
};
</script>
